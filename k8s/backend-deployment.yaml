apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-backend
  namespace: wedding-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wedding-backend
  template:
    metadata:
      labels:
        app: wedding-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-backend-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /app/backend/data
              chown -R 1000:1000 /app/backend/data
              chmod -R ug+rwX /app/backend/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: backend-data
              mountPath: /app/backend/data
      containers:
        - name: backend
          image: wedding-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: wedding-config
                  key: FRONTEND_ORIGIN
            - name: INQUIRY_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: wedding-config
                  key: INQUIRY_FROM_EMAIL
            - name: CAPTCHA_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: wedding-config
                  key: CAPTCHA_PROVIDER
            - name: CAPTCHA_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: wedding-config
                  key: CAPTCHA_REQUIRED
            - name: ALLOW_DEV_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: wedding-config
                  key: ALLOW_DEV_ORIGINS
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: JWT_SECRET
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: RESEND_API_KEY
            - name: INQUIRY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: INQUIRY_WEBHOOK_URL
            - name: CAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: CAPTCHA_SECRET_KEY
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: TURNSTILE_SECRET_KEY
            - name: RECAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: RECAPTCHA_SECRET_KEY
            - name: HCAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: HCAPTCHA_SECRET_KEY
            - name: SECURITY_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: SECURITY_ALERT_WEBHOOK_URL
            - name: EDGE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: EDGE_SHARED_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: DATABASE_URL
                  optional: true
            - name: DATABASE_SSL
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: DATABASE_SSL
                  optional: true
            - name: PGSSLMODE
              valueFrom:
                secretKeyRef:
                  name: wedding-secrets
                  key: PGSSLMODE
                  optional: true
          volumeMounts:
            - name: backend-data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: backend-data

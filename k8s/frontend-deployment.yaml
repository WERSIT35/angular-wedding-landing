apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-frontend
  namespace: wedding-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wedding-frontend
  template:
    metadata:
      labels:
        app: wedding-frontend
    spec:
      containers:
        - name: frontend
          image: wedding-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

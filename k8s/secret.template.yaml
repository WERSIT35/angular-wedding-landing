apiVersion: v1
kind: Secret
metadata:
  name: wedding-secrets
  namespace: wedding-site
type: Opaque
stringData:
  ADMIN_EMAIL: "replace-admin-email@example.com"
  ADMIN_PASSWORD: "replace-with-strong-password"
  JWT_SECRET: "replace-with-strong-random-secret"
  RESEND_API_KEY: "replace-with-resend-api-key"
  INQUIRY_WEBHOOK_URL: ""
  CAPTCHA_SECRET_KEY: ""
  TURNSTILE_SECRET_KEY: ""
  RECAPTCHA_SECRET_KEY: ""
  HCAPTCHA_SECRET_KEY: ""
  SECURITY_ALERT_WEBHOOK_URL: ""
  EDGE_SHARED_SECRET: ""
  DATABASE_URL: ""
  DATABASE_SSL: "true"
  PGSSLMODE: "require"

apiVersion: v1
kind: Service
metadata:
  name: wedding-backend
  namespace: wedding-site
spec:
  selector:
    app: wedding-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: wedding-frontend
  namespace: wedding-site
spec:
  selector:
    app: wedding-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

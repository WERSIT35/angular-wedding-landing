<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Admin Editor</title>
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <main class="admin-shell">
    <section class="admin-topbar card" id="authCard">
      <h2>Admin Login</h2>
      <label>Email<input id="email" type="email" placeholder="admin@eliteweddings.local" /></label>
      <label>Password<input id="password" type="password" placeholder="********" /></label>
      <button id="loginBtn">Login</button>
      <div id="mfaWrap" class="hidden">
        <label>MFA Code<input id="mfaCode" type="text" placeholder="6-digit code" /></label>
        <button id="verifyMfaBtn">Verify MFA</button>
      </div>
      <p id="authMsg" class="msg"></p>
    </section>

    <section class="admin-topbar card hidden" id="adminBar">
      <div class="toolbar-row">
        <label>
          API Base
          <input id="apiBaseInput" type="text" placeholder="http://localhost:4000" />
        </label>
        <div class="language-toggle" aria-label="Language">
          <button id="langEnBtn" class="active" type="button">EN</button>
          <button id="langKaBtn" type="button">KA</button>
        </div>
      </div>

      <div class="toolbar-row">
        <button id="saveApiBaseBtn" class="ghost">Save API Base</button>
        <button id="loadBtn" class="ghost">Load</button>
        <button id="injectTemplateBtn" class="ghost">Initialize Starter Content</button>
        <button id="saveBtn">Save Content</button>
        <button id="logoutBtn" class="ghost">Logout</button>
      </div>

      <p id="contentMsg" class="msg"></p>
    </section>

    <div id="previewRoot" class="hidden"></div>

    <details class="card hidden" id="advancedPanel">
      <summary>Advanced JSON (optional)</summary>
      <textarea id="contentEditor" rows="12" spellcheck="false"></textarea>
      <div class="toolbar-row">
        <button id="formatBtn" class="ghost">Apply JSON</button>
      </div>
    </details>

    <section class="card hidden" id="auditPanel">
      <h2>Activity Logs</h2>
      <button id="refreshAuditBtn" class="ghost">Refresh Logs</button>
      <pre id="auditOutput" class="output"></pre>
    </section>

    <section class="card hidden" id="mfaPanel">
      <h2>MFA Setup</h2>
      <button id="setupMfaBtn" class="ghost">Enable / Reset MFA</button>
      <pre id="mfaOutput" class="output"></pre>
    </section>
  </main>

  <script src="/admin/admin.js" type="module"></script>
</body>
</html>

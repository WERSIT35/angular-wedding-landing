<section class="section gallery-section" id="portfolio">
  <div class="section-heading">
    <p
      class="eyebrow"
      [class.inline-live-edit]="isInlineEditing()"
      [attr.contenteditable]="isInlineEditing() ? 'plaintext-only' : null"
      (blur)="onInlineEdit($event, 'landing.galleryEyebrow')"
    >{{ galleryEyebrow() }}</p>
    <h2
      [class.inline-live-edit]="isInlineEditing()"
      [attr.contenteditable]="isInlineEditing() ? 'plaintext-only' : null"
      (blur)="onInlineEdit($event, 'landing.galleryTitle')"
    >{{ galleryTitle() }}</h2>
  </div>

  <!-- An editorial spread: every photo is on the page at once, no carousel to click through. -->
  <ul class="gallery-mosaic" role="list">
    @for (photo of galleryPhotos(); track photo.src) {
      <li class="gallery-tile">
        <figure class="gallery-card">
          <img
            [src]="photoSrc(photo.src)"
            [attr.srcset]="photoSrcset(photo.src)"
            sizes="(max-width: 760px) 100vw, 60vw"
            [alt]="photo.alt"
            loading="lazy"
            decoding="async"
            width="900"
            height="1200"
          />
        </figure>
      </li>
    }
  </ul>
</section>
